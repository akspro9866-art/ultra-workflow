<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Callout — kinetic-editorial</title>
<style>
  :root {
    --bg: #f6f0e6;
    --surface: #e8dfce;
    --ink: #1c1b18;
    --muted: #6a645a;
    --accent: #e4572e;
    --teal: #2f5d62;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'Ultra Sans', 'Segoe UI', sans-serif; color: var(--ink); }
  .frame { position: absolute; inset: 0; padding: 8vh 7vw; }
  .kicker {
    font-family: 'Ultra Mono', 'Consolas', monospace; font-size: 1.8vh; letter-spacing: 0.22em;
    color: var(--muted); text-transform: uppercase;
  }
  .number {
    position: absolute; left: 7vw; top: 24vh;
    font-family: 'Ultra Display', 'Arial Black', sans-serif; font-weight: 700;
    font-size: 20vw; line-height: 0.82; letter-spacing: -0.045em; color: var(--ink);
  }
  .number small { font-size: 0.3em; letter-spacing: 0; color: var(--accent); vertical-align: 1.1em; margin-left: 0.06em; }
  .label {
    position: absolute; left: 7.5vw; top: 56vh; width: 38vw;
    font-size: 3.1vh; line-height: 1.3; font-weight: 600;
  }
  .source {
    position: absolute; left: 7.5vw; top: 70vh; width: 34vw;
    font-family: 'Ultra Mono', 'Consolas', monospace; font-size: 1.5vh; line-height: 1.6;
    letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase;
  }
  .arrow { position: absolute; left: 45vw; top: 30vh; width: 44vw; height: 32vh; }
  .arrow path {
    fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  .arrow circle { fill: var(--accent); opacity: 0; }
  .note {
    position: absolute; right: 7vw; top: 20vh; width: 24vw; text-align: right;
    font-family: 'Ultra Mono', 'Consolas', monospace; font-size: 1.6vh; letter-spacing: 0.12em;
    line-height: 1.7; color: var(--teal); text-transform: uppercase;
  }
  .foot {
    position: absolute; left: 7vw; right: 7vw; bottom: 7vh; display: flex; justify-content: space-between;
    font-family: 'Ultra Mono', 'Consolas', monospace; font-size: 1.5vh; letter-spacing: 0.18em;
    color: var(--muted); text-transform: uppercase;
  }
  .tick { position: absolute; right: 7vw; top: 60vh; width: 26vw; height: 1px; background: rgba(28,27,24,0.25); }
  .tick::after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; background: var(--accent); }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker">Data callout / retention curve</div>
    <div class="number" id="number">68<small>%</small></div>
    <div class="label" id="label">of viewers leave<br/>before the first cut.</div>
    <div class="source" id="source">Source: longitudinal shortform review<br/>n = 2,480 sessions</div>
    <svg class="arrow" viewBox="0 0 440 320" aria-hidden="true">
      <path id="path" pathLength="1" d="M18 250 C 110 236, 128 92, 250 78 S 384 64, 408 38" />
      <circle id="dot" cx="408" cy="38" r="7" />
    </svg>
    <div class="note" id="note">the drop is<br/>not the content —<br/>it is the delay</div>
    <div class="tick"></div>
    <div class="foot"><span>Kinetic Editorial</span><span>Data / 01</span></div>
  </div>
  <script>
    (function () {
      function outCubic(t) { t = Math.max(0, Math.min(1, t)); var p = t - 1; return p * p * p + 1; }
      function inOutSine(t) { t = Math.max(0, Math.min(1, t)); return -(Math.cos(Math.PI * t) - 1) / 2; }
      var number = document.getElementById('number');
      var label = document.getElementById('label');
      var source = document.getElementById('source');
      var path = document.getElementById('path');
      var dot = document.getElementById('dot');
      var note = document.getElementById('note');
      function apply(frame, fps) {
        var t = frame / (fps || 30);
        var pNum = outCubic(t / 0.6);
        number.style.opacity = String(pNum);
        number.style.transform = 'translateY(' + (1 - pNum) * 3 + 'vh)';
        label.style.opacity = String(outCubic((t - 0.35) / 0.45));
        source.style.opacity = String(outCubic((t - 0.6) / 0.4) * 0.9);
        var draw = inOutSine((t - 0.25) / 0.9);
        path.style.strokeDashoffset = String(1 - draw);
        dot.style.opacity = String(draw > 0.96 ? 1 : 0);
        note.style.opacity = String(outCubic((t - 0.8) / 0.4) * 0.9);
      }
      window.__ULTRA_SEEK = function (frame, fps) { apply(frame, fps); return true; };
      window.ultraRender = function (frame, fps) { apply(frame, fps); };
      window.__ULTRA_SEEK(0, 30);
    })();
  </script>
</body>
</html>
